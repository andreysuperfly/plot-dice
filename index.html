<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Кости сюжета — генератор идей для квестов: мотив, сюжет из четырёх шагов, действие, выбор и секрет.">
<title>Кости сюжета</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Сверху мотив и пульт; ниже доска: ряд из 4 шагов сюжета, под ним лесенкой действие, выбор и секрет — каждая карточка в колонке своего шага. */
:root {
  --bg: #f3f4f6; --surface: #ffffff; --ink: #17181c; --muted: #6b7079; --line: #e3e5ea; --dash: #a3a8b2;
  --t1: #ffe4dc; --a1: #d9583b;
  --t2: #e2e7ff; --a2: #4a5fd6;
  --t3: #fbefd6; --a3: #a8720c;
  --t4: #dcf3e6; --a4: #2b8a5a;
  --t0: #ece9f7; --a0: #6a50c7;
  --warn: #b4540d;
  --f-ui: "Manrope", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121317; --surface: #1c1e24; --ink: #eceef2; --muted: #9da3ae; --line: #2c2f37; --dash: #5d6370;
  --t1: #3a2620; --a1: #ff8d72; --t2: #232a47; --a2: #9aa9ff; --t3: #382f1c; --a3: #e8b54d; --t4: #1d3529; --a4: #6fd39f;
  --t0: #2a2540; --a0: #b5a3ff; --warn: #f0a35e; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121317; --surface: #1c1e24; --ink: #eceef2; --muted: #9da3ae; --line: #2c2f37; --dash: #5d6370;
  --t1: #3a2620; --a1: #ff8d72; --t2: #232a47; --a2: #9aa9ff; --t3: #382f1c; --a3: #e8b54d; --t4: #1d3529; --a4: #6fd39f;
  --t0: #2a2540; --a0: #b5a3ff; --warn: #f0a35e; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); line-height: 1.5; }
p, h1, h2, h3 { margin: 0; }
button, select { font: inherit; color: inherit; }
.page { max-width: 1100px; margin: 0 auto; padding-inline: 18px; padding-block: 24px 64px; display: grid; gap: 18px; }
:focus-visible { outline: 3px solid var(--a2); outline-offset: 2px; }

.lbl { font-size: 14px; color: var(--muted); font-weight: 600; }
.title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.title h1 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.title p { color: var(--muted); font-size: 14px; }


/* мотив */
.sec { font-size: 15px; font-weight: 800; margin: 6px 0 -8px; padding-left: 4px; }
.sec span { color: var(--muted); font-weight: 600; }
.sech { display: flex; align-items: center; gap: 8px; margin: 6px 0 -8px; }
.sech .sec { margin: 0; }
.sech .ic button { background: var(--t0); }
.motive { background: var(--t0); border-radius: 26px; padding: 18px; display: grid; gap: 12px; --a: var(--a0); --t: var(--t0); }
.mrow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.mpart { background: var(--surface); border-radius: 18px; padding: 8px 8px 10px 12px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.mhead { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.mpart .ic button { background: var(--t0); }
.mpart small { font-size: 12px; font-weight: 700; color: var(--a0); cursor: help; }
.mpart b { font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
.idea { font-size: clamp(18px, 2.4vw, 22px); font-weight: 700; line-height: 1.35; text-wrap: balance; }
@media (max-width: 760px) { .mrow { grid-template-columns: 1fr 1fr; } }

/* пульт */
.panel { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.btn { border: 0; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 10px 18px; font-weight: 700; cursor: pointer; }
.btn.dice { padding: 6px 22px; display: grid; place-items: center; }
.btn.dice svg { width: 56px; height: 36px; display: block; }
.btn.dice rect { fill: var(--bg); }
.btn.dice circle { fill: var(--ink); }
.btn.dice.rolling svg { animation: roll .45s ease; }
@keyframes roll { 0% { transform: rotate(0); } 40% { transform: rotate(-14deg) scale(1.08); } 100% { transform: rotate(0); } }
@media (prefers-reduced-motion: reduce) { .btn.dice.rolling svg { animation: none; } }
.story { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px 20px; display: grid; gap: 12px; font-size: 17px; line-height: 1.65; max-width: 100%; }
.story p { margin: 0; max-width: 70ch; }
.story .syn { font-weight: 700; }
.frag { border-radius: 6px; padding: 1px 2px; margin: 0 -2px; cursor: pointer; transition: background .15s; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.frag:hover, .frag:focus-visible, .frag.hot { background: var(--ft); }
.frag[data-card^="s"] { --ft: var(--t1); } .frag[data-card="act"] { --ft: var(--t3); }
.frag[data-card="choice"] { --ft: var(--t2); } .frag[data-card="egg"] { --ft: var(--t4); } .frag[data-card="motive"] { --ft: var(--t0); }
.card.hot { box-shadow: 0 0 0 3px var(--a); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
.ghost:disabled { opacity: .4; cursor: not-allowed; }
.sel { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); }
.sel select { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; color: var(--ink); }
.confirm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--warn); border-radius: 16px; padding: 10px 14px; font-size: 14px; }

/* доска */
.scroller { overflow-x: auto; margin-inline: -18px; padding-inline: 18px; padding-block: 26px 8px; }
.board { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 34px; row-gap: 40px; min-width: 780px; }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.wires path { fill: none; stroke: var(--dash); stroke-width: 2; stroke-dasharray: 6 6; stroke-linecap: round; }
.wires .pairarc { stroke-dasharray: 2 6; stroke-width: 2; opacity: .8; }
.wires .pairarc.hot { stroke: var(--a1); opacity: 1; }
.wires .head { fill: var(--dash); stroke: none; }
.swipe { display: none; font-size: 13px; color: var(--muted); }
@media (max-width: 820px) { .swipe { display: block; } }

.card { position: relative; z-index: 1; border-radius: 22px; padding: 14px; display: grid; gap: 6px; align-content: start; min-width: 0; background: var(--t); border: 2px solid transparent; transition: border-color .2s; }
.card.locked { border-color: var(--a); }
.card.flash { animation: flash .9s ease; }
[data-roll] { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.pick { position: fixed; z-index: 50; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 12px 40px rgb(0 0 0 / .22); padding: 6px; width: max-content; min-width: 200px; max-width: min(340px, calc(100vw - 32px)); max-height: min(360px, 60vh); overflow-y: auto; overscroll-behavior: contain; }
.pick button { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; font-size: 14px; line-height: 1.3; padding: 8px 12px; border-radius: 12px; cursor: pointer; }
.pick button:hover, .pick button:focus-visible { background: var(--bg); outline: none; }
.pick button[aria-current] { font-weight: 800; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 var(--a); } 30% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--a) 35%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .card.flash { animation: none; } }
.step { --t: var(--t1); --a: var(--a1); grid-row: 1; }
.c-act { --t: var(--t3); --a: var(--a3); grid-row: 2; }
.c-choice { --t: var(--t2); --a: var(--a2); grid-row: 3; }
.c-egg { --t: var(--t4); --a: var(--a4); grid-row: 4; }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; min-width: 0; }
.tag { font-size: 12px; font-weight: 800; color: var(--a); background: var(--surface); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.n { width: 26px; height: 26px; border-radius: 50%; background: var(--a); color: var(--surface); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.ic { display: inline-flex; gap: 2px; }
.ic { flex: none; }
.ic button { border: 0; background: var(--surface); color: var(--ink); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; padding: 0; }
.ic svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.ic svg .f { fill: currentColor; stroke: none; }
.ic button:hover { box-shadow: inset 0 0 0 2px var(--a, var(--a0)); }
.ic button[aria-pressed="true"] { background: var(--a, var(--a0)); color: var(--surface); }
.card small { font-size: 12px; color: var(--a); font-weight: 700; }
.ttl { font-size: 17px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
.c-choice .ttl, .c-act .ttl, .c-egg .ttl { font-size: 19px; }
.desc { font-size: 14px; color: var(--muted); }
.ask { font-size: 14px; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; }
.badge { font-size: 11px; font-weight: 700; color: var(--a); background: var(--surface); border-radius: 999px; padding: 2px 8px; }
.badge.warn { color: var(--warn); }
.fork { display: grid; gap: 5px; }
.fork div { background: var(--surface); border-radius: 12px; padding: 7px 10px; font-size: 13px; }
.fork strong { display: block; font-size: 14px; }
.later { font-size: 13px; }
.later b { color: var(--a); }
.at { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.at select { background: var(--surface); border: 0; border-radius: 999px; padding: 3px 8px; font-weight: 700; color: var(--ink); }
[contenteditable="true"] { outline: 2px dashed var(--a); outline-offset: 2px; border-radius: 6px; background: var(--surface); padding: 0 4px; }

.saved { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px 18px; display: grid; gap: 10px; }
.saved h2 { font-size: 17px; }
.saved ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.saved .row { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.muted { color: var(--muted); font-size: 14px; }
.keys { color: var(--muted); font-size: 13px; }
kbd { font: inherit; font-weight: 700; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 14px; z-index: 5; }
</style>
</head>
<body>
<div class="page">
  <div class="title">
    <h1 title="Генератор идей для квестов: бросаешь кости — получаешь завязку, ход сюжета, выбор игрока и секрет">Кости сюжета</h1>
  </div>

  <div class="sech"><h2 class="sec" title="Чего хочет герой и что ему мешает. Из этого собирается идея квеста">Завязка</h2><span class="ic"><button data-roll="motive" aria-label="Другая завязка целиком. Удержи, чтобы выбрать из списка" title="Другая завязка целиком. Удержи — выбрать из списка"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="3.5"/><circle cx="7.2" cy="7.2" r="1.2" class="f"/><circle cx="10" cy="10" r="1.2" class="f"/><circle cx="12.8" cy="12.8" r="1.2" class="f"/></svg></button></span></div>
  <section class="motive" id="motive" aria-label="Завязка"></section>

  <div class="panel">
    <div class="seg" id="skels" role="group" aria-label="Тип истории"></div>
    <label class="sel" for="pack" title="Набор действий под жанр игры">Жанр
      <select id="pack"></select>
    </label>
  </div>
  <div class="confirm" id="confirm" hidden></div>

  <div class="panel">
    <button class="btn dice" id="rollAll" aria-label="Бросить кости: сюжет, действие, выбор и секрет" title="Бросить сюжет, действие, выбор и секрет. Завязку меняет её кубик. Клавиши: пробел — бросить, 1–4 — бросить один шаг, ⌘/Ctrl+Z — назад"><svg viewBox="0 0 64 40" aria-hidden="true"><g transform="rotate(-12 18 20)"><rect x="4" y="6" width="28" height="28" rx="7"/><circle cx="11.5" cy="13.5" r="2.6"/><circle cx="24.5" cy="13.5" r="2.6"/><circle cx="18" cy="20" r="2.6"/><circle cx="11.5" cy="26.5" r="2.6"/><circle cx="24.5" cy="26.5" r="2.6"/></g><g transform="rotate(14 46 21)"><rect x="32" y="7" width="28" height="28" rx="7"/><circle cx="39.5" cy="14.5" r="2.6"/><circle cx="52.5" cy="27.5" r="2.6"/><circle cx="46" cy="21" r="2.6"/></g></svg></button>
    <button class="ghost" id="undo" aria-label="Отменить">↶ Назад</button>
    <button class="ghost" id="redo" aria-label="Вернуть">↷ Вперёд</button>
    <button class="ghost" id="copy" title="Квест целиком обычным текстом — вставить в документ или отправить">Скопировать</button>
    <button class="ghost" id="fav">В избранное</button>
  </div>

  <h2 class="sec" id="plotHead" title="Сюжет квеста по шагам. Шаги 1 и 4, 2 и 3 — пары: конец отвечает на начало">Сюжет</h2>
  <p class="swipe">Схема шире экрана, листай вбок →</p>
  <div class="scroller">
    <div class="board" id="board">
      <svg class="wires" id="wires" aria-hidden="true"></svg>
    </div>
  </div>


  <h2 class="sec" title="Карточки, собранные в рассказ. Наведи на кусок текста — подсветится, нажми — перейдёшь к его карточке">История</h2>
  <section class="story" id="story" aria-live="polite"></section>

  <section class="saved">
    <h2>Избранное</h2>
    <p class="muted" id="favEmpty" title="Избранное хранится только в этом браузере">Пока пусто.</p>
    <ol id="favList"></ol>
  </section>
</div>

<script>
(() => {
'use strict';

// ===================== КОЛОДЫ (данные; для перевода и новых наборов правится только это) =====================
// Пары: шаги 1 и 4 берутся из одной пары p14, шаги 2 и 3 — из пары p23. Конец отвечает на начало, проверка — на помощь.
const SKELETONS = {
  tale: { name: 'Сказка', tip: 'Схема Владимира Проппа: так устроены почти все народные сказки', labels: ['Начало', 'Помощь', 'Проверка', 'Конец'],
    tips: ['С чего всё начинается', 'Кто или что помогает герою', 'Как героя проверяют', 'Чем всё заканчивается. Отвечает на шаг 1'],
    p14: [
      [['Не пускают', 'Кто-то закрывает дорогу и не объясняет почему.', 'кто-то закрывает герою дорогу и не объясняет почему'], ['Признали своим', 'Тот, кто не пускал, открывает сам. Награда — доступ, а не вещь.', 'тот, кто не пускал, сам открывает дверь: награда — доступ, а не вещь']],
      [['Что-то пропало', 'У кого-то исчезла важная вещь или близкий человек.', 'у кого-то пропадает важная вещь или близкий человек'], ['Нашлось, но не то', 'Пропажа вернулась другой. Или другим стал тот, кто искал.', 'пропажа находится, но уже другой — или другим стал тот, кто искал']],
      [['Запрет нарушен', 'Герой сделал то, чего было нельзя. Теперь придётся платить.', 'герой нарушает запрет, и теперь придётся платить'], ['Расплата стала даром', 'То, чем пришлось заплатить, оказалось именно тем, что было нужно.', 'расплата оказывается именно тем, что было нужно']],
      [['Помощь с подвохом', 'Кто-то предлагает помочь, но что-то здесь не так.', 'кто-то предлагает герою помощь, но с подвохом'], ['Обманщик раскрыт', 'Герой показывает всем, кто на самом деле врал.', 'герой показывает всем, кто на самом деле врал']],
      [['Беда', 'Кто-то навредил: украл, похитил, обманул, проклял.', 'случается беда: кто-то украл, похитил, обманул или проклял'], ['Виновный наказан', 'Тот, кто навредил, получает своё, но не так, как все ждали.', 'виновный получает своё, но не так, как все ждали']],
    ],
    p23: [
      [['Неожиданный помощник', 'Помогает тот, на кого не думал. Даёт не вещь, а совет.', 'на помощь приходит тот, на кого не думали, и даёт не вещь, а совет'], ['Испытание', 'Героя проверяют и не говорят, что это проверка. Надо вытерпеть, а не победить.', 'героя проверяют, не говоря, что это проверка: надо вытерпеть, а не победить']],
      [['Странный подарок', 'Герою дают вещь, и непонятно, зачем она.', 'герою дарят странный подарок, и непонятно, зачем он'], ['Подарок сработал', 'Вещь пригодилась, но совсем не для того, о чём он думал.', 'подарок срабатывает, но совсем не так, как думал герой']],
      [['Просьба слабого', 'Кто-то слабый просит о мелочи.', 'кто-то слабый просит героя о мелочи'], ['Слабый отплатил', 'Тот, кому помог, выручает в самую трудную минуту.', 'тот, кому герой помог, выручает его в самую трудную минуту']],
      [['Совет-запрет', 'Помощник говорит: делай что хочешь, только не это.', 'помощник предупреждает: делай что хочешь, только не это'], ['Соблазн', 'Всё подталкивает сделать именно то, что запретили.', 'всё подталкивает героя сделать именно то, что запретили']],
      [['Проводник', 'Кто-то знает дорогу и ведёт, но не до конца.', 'появляется проводник, который знает дорогу, но ведёт не до конца'], ['Дальше сам', 'Проводник исчезает в самом трудном месте. Дальше герою одному.', 'проводник исчезает в самом трудном месте, и дальше герою одному']],
    ] },
  detective: { name: 'Детектив', tip: 'Что-то случилось. Герой ищет правду и сначала идёт по ложному следу', labels: ['Событие', 'Улика', 'Ложный след', 'Разгадка'],
    tips: ['Что случилось', 'Что нашёл герой', 'Куда улика завела не туда', 'Как всё было на самом деле. Отвечает на шаг 1'],

  ['Награда за упорство', 'Заговори с персонажем в пятый раз — и он скажет то, чего раньше не говорил.'],
  ['Вещь возвращается', 'Предмет из этого квеста всплывает в другом, уже в чужих руках.'],
  ['Ложная подсказка', 'Надпись будто подсказывает ответ. Это шутка, и она смешнее правды.'],
  ['Зеркало', 'Персонаж случайно описывает самого героя, не зная, кто перед ним.'],
  ['Вещь не отсюда', 'Где-то лежит предмет, которого здесь быть не может. Никто его не замечает.'],
  ['Настоящее имя', 'Назови персонажа по имени — и он ответит иначе. Имя спрятано в другом квесте.'],
  ['Подсказка в декорациях', 'Рисунок на стене заранее показывает, чем всё кончится.'],
];

// ===================== СОСТОЯНИЕ =====================
const LS = 'kosti:';
const store = {
  get(k, d) { try { const v = localStorage.getItem(LS + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch { /* без памяти тоже работает */ } },
};
const $ = (s) => document.querySelector(s);
const ri = (n, not) => { if (n <= 1) return 0; let i; do { i = Math.floor(Math.random() * n); } while (i === not); return i; };
const clone = (o) => JSON.parse(JSON.stringify(o));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function fresh(skel = 'tale', pack = 'adv') {
  const S = SKELETONS[skel];
  const p14 = ri(S.p14.length), p23 = ri(S.p23.length);
  const m = {}, b = ri(BUNDLES.length); for (const k of Object.keys(MOTIVE)) m[k] = { i: b, lock: false };
  return {
    skel, pack, motive: m,
    steps: [p14, p23, p23, p14].map((p) => ({ p, lock: false, custom: null })),
    act: { i: ri(PACKS[pack].items.length), lock: false, at: 2, custom: null },
    choice: { i: ri(CHOICES.length), lock: false, at: 3, custom: null },
    egg: { i: ri(SECRETS.length), lock: false, at: 4, custom: null },
  };
}
let st = store.get('state', null);
if (!st || !SKELETONS[st.skel] || !PACKS[st.pack]) st = fresh();
try {
  st.steps.forEach((x, k) => { if (!(x.p < SKELETONS[st.skel][k === 0 || k === 3 ? 'p14' : 'p23'].length)) x.p = 0; });
  for (const k of Object.keys(MOTIVE)) if (!st.motive[k] || !(st.motive[k].i < MOTIVE[k].items.length)) st.motive[k] = { i: 0, lock: false };
  if (!(st.act.i < PACKS[st.pack].items.length)) st.act.i = 0;
  if (!(st.choice.i < CHOICES.length)) st.choice.i = 0;
  if (!(st.egg.i < SECRETS.length)) st.egg.i = 0;
} catch { st = fresh(); }
const undo = [], redo = [];

function commit(mut, flash = []) {
  undo.push(clone(st)); if (undo.length > 60) undo.shift();
  redo.length = 0;
  mut();
  store.set('state', st);
  render(flash);
}

// ===================== ПРАВИЛА ПЕРЕБРОСА =====================
const PARTNER = { 0: 3, 3: 0, 1: 2, 2: 1 };
const groupOf = (k) => (k === 0 || k === 3 ? 'p14' : 'p23');
function rollStep(k, flash) {
  const S = SKELETONS[st.skel], s = st.steps[k], o = st.steps[PARTNER[k]];
  s.p = ri(S[groupOf(k)].length, s.p); s.custom = null;
  if (!o.lock) { o.p = s.p; o.custom = null; flash.push('s' + PARTNER[k]); }
  flash.push('s' + k);
}
function rollMotive() {
  const free = Object.keys(st.motive).filter((k) => !st.motive[k].lock);
  if (free.length) { const b = ri(BUNDLES.length, st.motive[free[0]].i); for (const k of free) st.motive[k].i = b; }
}
function rollAll() {
  const flash = [];
  commit(() => {
    const S = SKELETONS[st.skel];
    for (const pair of [[0, 3], [1, 2]]) {
      const [a, b] = pair, A = st.steps[a], B = st.steps[b];
      if (A.lock && B.lock) continue;
      const g = groupOf(a), n = S[g].length;
      const p = A.lock ? A.p : B.lock ? B.p : ri(n, A.p);
      if (!A.lock) { A.p = p; A.custom = null; flash.push('s' + a); }
      if (!B.lock) { B.p = p; B.custom = null; flash.push('s' + b); }
    }
    if (!st.act.lock) { st.act.i = ri(PACKS[st.pack].items.length, st.act.i); st.act.custom = null; st.act.at = 1 + ri(3) ; flash.push('act'); }
    if (!st.choice.lock) { st.choice.i = ri(CHOICES.length, st.choice.i); st.choice.custom = null; st.choice.at = 2 + ri(2); flash.push('choice'); }
    if (!st.egg.lock) { st.egg.i = ri(SECRETS.length, st.egg.i); st.egg.custom = null; st.egg.at = Math.random() < .7 ? 4 : 1 + ri(3); flash.push('egg'); }
    if (st.act.at > st.choice.at && !st.act.lock && !st.choice.lock) [st.act.at, st.choice.at] = [st.choice.at, st.act.at];
  }, flash);
}
function rollOne(id) {
  const flash = [];
  commit(() => {
    if (id === 'motive') rollMotive();
    else if (id.startsWith('s')) rollStep(+id[1], flash);
    else if (id === 'act') { st.act.i = ri(PACKS[st.pack].items.length, st.act.i); st.act.custom = null; flash.push('act'); }
    else if (id === 'choice') { st.choice.i = ri(CHOICES.length, st.choice.i); st.choice.custom = null; flash.push('choice'); }
    else if (id === 'egg') { st.egg.i = ri(SECRETS.length, st.egg.i); st.egg.custom = null; flash.push('egg'); }
    else if (id.startsWith('m-')) { const k = id.slice(2); st.motive[k].i = ri(MOTIVE[k].items.length, st.motive[k].i); }
  }, flash);
}
// ===================== СПИСОК ВАРИАНТОВ (удержать кубик) =====================
function variants(id) {
  if (id === 'motive') return { cur: st.motive.want.i, list: BUNDLES.map((b) => b[0][0].toUpperCase() + b[0].slice(1)) };
  if (id.startsWith('s')) { const k = +id[1]; return { cur: st.steps[k].p, list: SKELETONS[st.skel][groupOf(k)].map((pr) => pr[k < 2 ? 0 : 1][0]) }; }
  if (id.startsWith('m-')) { const k = id.slice(2); return { cur: st.motive[k].i, list: MOTIVE[k].items }; }
  if (id === 'act') return { cur: st.act.i, list: PACKS[st.pack].items.map((x) => x[0]) };
  if (id === 'choice') return { cur: st.choice.i, list: CHOICES.map((x) => x[1]) };
  return { cur: st.egg.i, list: SECRETS.map((x) => x[0]) };
}
function pickVariant(id, i) {
  const flash = [];
  commit(() => {
    if (id === 'motive') { for (const k of Object.keys(st.motive)) if (!st.motive[k].lock) st.motive[k].i = i; }
    else if (id.startsWith('s')) {
      const k = +id[1], s = st.steps[k], o = st.steps[PARTNER[k]];
      s.p = i; s.custom = null; flash.push(id);
      if (!o.lock) { o.p = i; o.custom = null; flash.push('s' + PARTNER[k]); }
    } else if (id.startsWith('m-')) st.motive[id.slice(2)].i = i;
    else { st[id].i = i; st[id].custom = null; flash.push(id); }
  }, flash);
}
let picker = null, holdTimer = 0, swallowClick = false;
function closePicker(focusBack) {
  if (!picker) return;
  const { el, btn } = picker; picker = null; el.remove();
  if (focusBack) document.querySelector(`[data-roll="${btn}"]`)?.focus();
}
function openPicker(id, btn) {
  closePicker();
  const { cur, list } = variants(id);
  const el = document.createElement('div');
  el.className = 'pick'; el.setAttribute('role', 'menu');
  el.innerHTML = list.map((t, i) => `<button role="menuitem" data-pick="${i}"${i === cur ? ' aria-current="true"' : ''}>${esc(t)}</button>`).join('');
  document.body.append(el);
  const r = btn.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = Math.max(16, Math.min(r.right - w, innerWidth - w - 16)) + 'px';
  el.style.top = (r.bottom + 6 + h > innerHeight - 8 ? Math.max(8, r.top - 6 - h) : r.bottom + 6) + 'px';
  picker = { el, id, btn: id };
  (el.querySelector('[aria-current]') || el.firstChild).focus({ preventScroll: true });
  el.querySelector('[aria-current]')?.scrollIntoView({ block: 'nearest' });
}
document.addEventListener('pointerdown', (e) => {
  if (picker && !picker.el.contains(e.target)) closePicker();
  const b = e.target.closest('[data-roll]');
  if (!b || e.button !== 0) return;
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => { swallowClick = true; openPicker(b.dataset.roll, b); }, 450);
});
for (const ev of ['pointerup', 'pointercancel', 'pointerleave', 'dragstart']) document.addEventListener(ev, () => clearTimeout(holdTimer), true);
document.addEventListener('contextmenu', (e) => {
  const b = e.target.closest('[data-roll]');
  if (!b) return;
  e.preventDefault(); clearTimeout(holdTimer);
  if (!picker) { swallowClick = true; openPicker(b.dataset.roll, b); }
});
document.addEventListener('keydown', (e) => {
  if (!picker) return;
  const items = [...picker.el.querySelectorAll('button')], i = items.indexOf(document.activeElement);
  if (e.key === 'Escape') { e.preventDefault(); closePicker(true); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); }
  else if (e.key === 'Tab') closePicker();
  e.stopImmediatePropagation();
}, true);
window.addEventListener('resize', () => closePicker());
document.addEventListener('scroll', (e) => { if (picker && !picker.el.contains(e.target)) closePicker(); }, true);

const objOf = (id) => (id.startsWith('s') ? st.steps[+id[1]] : id.startsWith('m-') ? st.motive[id.slice(2)] : st[id]);

// ===================== ТЕКСТЫ КАРТОЧЕК =====================
function stepText(k) {
  const s = st.steps[k];
  if (s.custom) return s.custom;
  const pair = SKELETONS[st.skel][groupOf(k)][s.p];
  const [t, d, story] = pair[k === 0 || k === 1 ? 0 : 1];
  return { t, d, story };
}
const actText = () => st.act.custom ?? { t: PACKS[st.pack].items[st.act.i][0], d: PACKS[st.pack].items[st.act.i][1] };
const eggText = () => st.egg.custom ?? { t: SECRETS[st.egg.i][0], d: SECRETS[st.egg.i][1] };
const choiceData = () => { const c = CHOICES[st.choice.i]; return st.choice.custom ? { ...st.choice.custom, type: c[0], a: c[2], ra: c[3], b: c[4], rb: c[5], later: c[6] } : { t: c[1], type: c[0], a: c[2], ra: c[3], b: c[4], rb: c[5], later: c[6] }; };
const mWord = (k) => MOTIVE[k].items[st.motive[k].i];
const ideaText = () => `Герой хочет ${mWord('want')}. Мешает ${mWord('block')}. Отступить нельзя: ${mWord('because')}. Если не выйдет, ${mWord('stake')}.`;

// ===================== ОТРИСОВКА =====================
const SVG = {
  die: '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="3.5"/><circle cx="7.2" cy="7.2" r="1.2" class="f"/><circle cx="10" cy="10" r="1.2" class="f"/><circle cx="12.8" cy="12.8" r="1.2" class="f"/></svg>',
  lock: '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4.5" y="9" width="11" height="8" rx="2"/><path d="M7 9V6.8a3 3 0 0 1 6 0V9"/></svg>',
  open: '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4.5" y="9" width="11" height="8" rx="2"/><path d="M7 9V6.8a3 3 0 0 1 5.8-1"/></svg>',
  pen: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16l1-4 8-8 3 3-8 8z"/><path d="M11.5 5.5l3 3"/></svg>',
};
const icons = (id, o, editable = true) => `<span class="ic">
  <button data-roll="${id}" aria-label="Другой вариант. Удержи, чтобы выбрать из списка" title="Другой вариант. Удержи — выбрать из списка">${SVG.die}</button>
  <button data-lock="${id}" aria-pressed="${o.lock}" aria-label="${o.lock ? 'Открепить' : 'Закрепить'}" title="${o.lock ? 'Закреплено: не изменится при броске. Нажми, чтобы открепить' : 'Закрепить: не изменится при броске'}">${o.lock ? SVG.lock : SVG.open}</button>
  ${editable ? `<button data-edit="${id}" aria-label="Написать своё" title="Написать своё">${SVG.pen}</button>` : ''}</span>`;
const atSel = (id, at) => `<label class="at" for="at-${id}" title="К какому шагу сюжета относится карточка">на шаге <select id="at-${id}" data-at="${id}">${[1, 2, 3, 4].map((n) => `<option ${n === at ? 'selected' : ''}>${n}</option>`).join('')}</select></label>`;

function render(flash = []) {
  const S = SKELETONS[st.skel];
  // мотив
  $('#motive').innerHTML = `<div class="mrow">${Object.keys(MOTIVE).map((k) => `<div class="mpart"><div class="mhead"><small title="${MOTIVE[k].hint[0].toUpperCase() + MOTIVE[k].hint.slice(1)}">${MOTIVE[k].label}</small>${icons('m-' + k, st.motive[k], false)}</div><b>${esc(mWord(k))}</b></div>`).join('')}</div>
    <p class="idea">${esc(ideaText())}</p>`;
  // скелеты и наборы
  $('#skels').innerHTML = Object.entries(SKELETONS).map(([k, s]) => `<button data-skel="${k}" aria-pressed="${k === st.skel}" title="${esc(s.tip)}">${esc(s.name)}</button>`).join('');
  $('#pack').innerHTML = Object.entries(PACKS).map(([k, p]) => `<option value="${k}" ${k === st.pack ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  // доска
  const mismatch14 = st.steps[0].p !== st.steps[3].p && !st.steps[0].custom && !st.steps[3].custom;
  const mismatch23 = st.steps[1].p !== st.steps[2].p && !st.steps[1].custom && !st.steps[2].custom;
  const board = $('#board');
  board.querySelectorAll('.card').forEach((c) => c.remove());
  const html = [];
  for (let k = 0; k < 4; k++) {
    const s = st.steps[k], tx = stepText(k), mis = (k === 0 || k === 3) ? mismatch14 : mismatch23;
    html.push(`<article class="card step${s.lock ? ' locked' : ''}" id="s${k}" data-k="${k}" style="grid-column:${k + 1}">
      <div class="top"><span class="n">${k + 1}</span>${icons('s' + k, s)}</div>
      <small title="${esc(S.tips[k])}">${esc(S.labels[k])}</small>
      <p class="ttl" data-f="t">${esc(tx.t)}</p><p class="desc" data-f="d">${esc(tx.d)}</p>
      <div class="badges">${s.custom ? '<span class="badge">своё</span>' : ''}${mis ? `<span class="badge warn" title="Шаги 1 и 4, 2 и 3 подбираются парами: конец отвечает на начало. Эта пара собрана из разных вариантов">не в паре с шагом ${PARTNER[k] + 1}</span>` : ''}</div></article>`);
  }
  const a = actText();
  html.push(`<article class="card c-act${st.act.lock ? ' locked' : ''}" id="act" style="grid-column:${st.act.at}">
    <div class="top"><span class="tag" title="Что игрок делает руками в этом месте сюжета">Действие</span>${icons('act', st.act)}</div>
    <p class="ttl" data-f="t">${esc(a.t)}</p><p class="ask" data-f="d">${esc(a.d)}</p>
    <div class="badges">${st.act.custom ? '<span class="badge">своё</span>' : ''}</div>${atSel('act', st.act.at)}</article>`);
  const c = choiceData();
  html.push(`<article class="card c-choice${st.choice.lock ? ' locked' : ''}" id="choice" style="grid-column:${st.choice.at}">
    <div class="top"><span class="tag" title="Развилка: игрок решает, и от этого зависит, что будет дальше">Выбор</span>${icons('choice', st.choice)}</div>
    ${st.choice.custom ? '' : `<small>${esc(c.type)} выбор</small>`}
    <p class="ttl" data-f="t">${esc(c.t)}</p>
    ${st.choice.custom ? `<p class="desc" data-f="d">${esc(st.choice.custom.d ?? '')}</p>` : `<div class="fork"><div><strong>${esc(c.a)}</strong>${esc(c.ra)}</div><div><strong>${esc(c.b)}</strong>${esc(c.rb)}</div></div><p class="later" title="Последствие, которое игрок увидит не сразу"><b>Аукнется позже:</b> ${esc(c.later)}</p>`}
    <div class="badges">${st.choice.custom ? '<span class="badge">своё</span>' : ''}</div>${atSel('choice', st.choice.at)}</article>`);
  const e = eggText();
  html.push(`<article class="card c-egg${st.egg.lock ? ' locked' : ''}" id="egg" style="grid-column:${st.egg.at}">
    <div class="top"><span class="tag" title="Пасхалка: мелочь для самых внимательных игроков, на прохождение не влияет">Секрет</span>${icons('egg', st.egg)}</div>
    <p class="ttl" data-f="t">${esc(e.t)}</p><p class="ask" data-f="d">${esc(e.d)}</p>
    <div class="badges">${st.egg.custom ? '<span class="badge">своё</span>' : ''}</div>${atSel('egg', st.egg.at)}</article>`);
  board.insertAdjacentHTML('beforeend', html.join(''));
  for (const id of flash) { const el = document.getElementById(id); if (el) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } }
  // пульт
  const allLocked = st.steps.every((s) => s.lock) && st.act.lock && st.choice.lock && st.egg.lock && Object.values(st.motive).every((m) => m.lock);
  $('#rollAll').disabled = allLocked;
  $('#rollAll').title = allLocked ? 'Всё закреплено. Открепи хоть одну карточку' : '';
  $('#undo').disabled = !undo.length; $('#redo').disabled = !redo.length;
  $('#story').innerHTML = storyHTML();
  $('#plotHead').innerHTML = `Сюжет <span>· ${esc(S.name.toLowerCase())}</span>`;
  requestAnimationFrame(drawWires);
}

// ===================== ИСТОРИЯ =====================
const lc = (x) => x.charAt(0).toLowerCase() + x.slice(1);
const unDot = (x) => x.replace(/[.?!…]+$/, '');
const frag = (id, text) => `<span class="frag" data-card="${id}" tabindex="0" role="link">${esc(text)}</span>`;
function storyHTML() {
  const LINK = ['Сначала', 'Потом', 'Затем', 'В конце'];
  const out = [`<p class="syn">${frag('motive', ideaText())}</p>`];
  const body = [];
  for (let k = 0; k < 4; k++) {
    const tx = stepText(k), s = st.steps[k];
    const line = s.custom ? `${LINK[k]}: ${unDot(tx.t)}${tx.d ? '. ' + unDot(tx.d) : ''}.` : `${LINK[k]} ${tx.story}.`;
    body.push(frag('s' + k, line));
    if (st.act.at === k + 1) {
      const a = actText();
      body.push(frag('act', st.act.custom ? `Здесь герою предстоит: ${lc(unDot(a.t))}. ${a.d}`.trim() : `Здесь герою придётся ${lc(a.t)}. ${a.d}`));
    }
    if (st.choice.at === k + 1) {
      const c = choiceData();
      body.push(frag('choice', st.choice.custom ? `Тут перед героем выбор: ${lc(unDot(c.t))}.${c.d ? ' ' + c.d : ''}` :
        `Тут перед героем выбор: ${lc(c.t)}. ${c.a} — ${lc(c.ra)} ${c.b} — ${lc(c.rb)} Позже это аукнется: ${lc(c.later)}`));
    }
    if (st.egg.at === k + 1) {
      const e = eggText();
      body.push(frag('egg', `А для внимательных спрятан секрет: ${lc(e.d || e.t)}`));
    }
  }
  out.push(`<p>${body.join(' ')}</p>`);
  return out.join('');
}
function goToCard(id) {
  const el = id === 'motive' ? $('#motive') : document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center', inline: 'center' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
$('#story').addEventListener('click', (e) => { const f = e.target.closest('.frag'); if (f) goToCard(f.dataset.card); });
$('#story').addEventListener('keydown', (e) => { const f = e.target.closest('.frag'); if (f && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.stopPropagation(); goToCard(f.dataset.card); } });
// наведение на кусок текста подсвечивает карточку, наведение на карточку — её кусок текста
function hot(id, on) {
  document.querySelectorAll(`.frag[data-card="${id}"]`).forEach((f) => f.classList.toggle('hot', on));
  const el = id === 'motive' ? null : document.getElementById(id);
  if (el) el.classList.toggle('hot', on);
}
$('#story').addEventListener('pointerover', (e) => { const f = e.target.closest('.frag'); if (f) hot(f.dataset.card, true); });
$('#story').addEventListener('pointerout', (e) => { const f = e.target.closest('.frag'); if (f) hot(f.dataset.card, false); });
$('#board').addEventListener('pointerover', (e) => { const c = e.target.closest('.card'); if (c) hot(c.id, true); });
$('#board').addEventListener('pointerout', (e) => { const c = e.target.closest('.card'); if (c && !c.contains(e.relatedTarget)) hot(c.id, false); });

// ===================== СТРЕЛКИ =====================
const NS = 'http://www.w3.org/2000/svg';
let hotPair = null;
function drawWires() {
  const board = $('#board'), svg = $('#wires');
  svg.replaceChildren();
  const B = board.getBoundingClientRect();
  const box = (id) => { const r = document.getElementById(id).getBoundingClientRect(); return { l: r.left - B.left, r: r.right - B.left, t: r.top - B.top, b: r.bottom - B.top, cx: (r.left + r.right) / 2 - B.left, cy: (r.top + r.bottom) / 2 - B.top }; };
  const add = (d, cls = '') => { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); if (cls) p.setAttribute('class', cls); svg.append(p); };
  const head = (x, y, dir) => add(dir === 'r' ? `M${x} ${y} l-9 -6 l0 12z` : `M${x} ${y} l-6 -9 l12 0z`, 'head');
  // сюжет по порядку
  for (let k = 0; k < 3; k++) { const A = box('s' + k), C = box('s' + (k + 1)); add(`M${A.r + 4} ${A.cy} L${C.l - 6} ${C.cy}`); head(C.l - 2, C.cy, 'r'); }
  // дуги пар над рядом
  for (const [a, b, h] of [[0, 3, 22], [1, 2, 12]]) {
    const A = box('s' + a), C = box('s' + b);
    add(`M${A.cx} ${A.t - 2} C${A.cx} ${A.t - h - 6} ${C.cx} ${C.t - h - 6} ${C.cx} ${C.t - 2}`, 'pairarc' + (hotPair && hotPair.includes(a) ? ' hot' : ''));
  }
  // вниз: от ближайшей карточки выше в той же колонке
  const lower = [['act', st.act.at], ['choice', st.choice.at], ['egg', st.egg.at]];
  lower.forEach(([id, col], i) => {
    let src = 's' + (col - 1);
    for (let j = 0; j < i; j++) if (lower[j][1] === col) src = lower[j][0];
    const A = box(src), C = box(id);
    add(`M${A.cx} ${A.b + 4} L${C.cx} ${C.t - 6}`); head(C.cx, C.t - 2, 'd');
  });
}
new ResizeObserver(() => drawWires()).observe($('#board'));
document.fonts?.ready.then(drawWires);
$('#board').addEventListener('pointerover', (e) => { const c = e.target.closest('.step'); const k = c ? +c.dataset.k : null; const p = k == null ? null : [k, PARTNER[k]]; if (String(p) !== String(hotPair)) { hotPair = p; drawWires(); } });
$('#board').addEventListener('pointerleave', () => { hotPair = null; drawWires(); });

// ===================== СОБЫТИЯ =====================
let toastT;
function toast(msg) {
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.append(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 1800);
}
let editing = null;
function startEdit(id) {
  if (editing) finishEdit(); // правил другую карточку — сохранить её
  const card = document.getElementById(id);
  if (!card) return;
  editing = id;
  let fields = card.querySelectorAll('[data-f]');
  if (id === 'choice' && !st.choice.custom) { // у выбора своё: заголовок + одна строка описания
    card.querySelector('.fork')?.remove(); card.querySelector('.later')?.remove();
    card.querySelector('[data-f="t"]').insertAdjacentHTML('afterend', '<p class="desc" data-f="d"></p>');
    fields = card.querySelectorAll('[data-f]');
  }
  fields.forEach((f) => { f.contentEditable = 'true'; });
  fields[0].focus();
  const sel = getSelection(); sel.selectAllChildren(fields[0]);
  toast('Пиши прямо в карточке. Готово — Enter');
}
function finishEdit() {
  if (!editing) return;
  const id = editing; editing = null;
  const card = document.getElementById(id);
  const t = card.querySelector('[data-f="t"]')?.textContent.trim() || '…';
  const d = card.querySelector('[data-f="d"]')?.textContent.trim() || '';
  commit(() => { const o = objOf(id); o.custom = { t, d }; o.lock = true; }, [id]);
}
document.addEventListener('focusout', (e) => {
  if (!editing) return;
  const id = editing, card = document.getElementById(id);
  setTimeout(() => { if (editing === id && !card.contains(document.activeElement)) finishEdit(); }, 0);
});
document.addEventListener('keydown', (e) => {
  if (editing) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); finishEdit(); } if (e.key === 'Escape') { editing = null; render(); } return; }
  const tag = e.target.tagName;
  if (tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA') return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); return; }
  if (mod || e.altKey) return;
  if (e.key === ' ' && tag !== 'BUTTON' && !e.target.closest?.('.frag')) { e.preventDefault(); rollAll(); }
  if (['1', '2', '3', '4'].includes(e.key)) rollOne('s' + (+e.key - 1));
});

document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (swallowClick && b.dataset.roll) { swallowClick = false; return; } // удержание открыло список — не бросать
  swallowClick = false;
  if (b.dataset.pick) { const { id } = picker; closePicker(true); pickVariant(id, +b.dataset.pick); return; }
  if (editing && !b.dataset.edit) finishEdit(); // нажал кнопку посреди правки — сначала сохранить текст
  if (b.dataset.roll) rollOne(b.dataset.roll);
  else if (b.dataset.lock) { const id = b.dataset.lock; commit(() => { const o = objOf(id); o.lock = !o.lock; }); }
  else if (b.dataset.edit) startEdit(b.dataset.edit);
  else if (b.dataset.skel) askSkeleton(b.dataset.skel);
});
document.addEventListener('change', (e) => {
  const s = e.target;
  if (editing) finishEdit();
  if (s.dataset.at) { const id = s.dataset.at; commit(() => { st[id].at = +s.value; }, [id]); }
  if (s.id === 'pack') commit(() => { st.pack = s.value; if (!st.act.lock) { st.act.i = ri(PACKS[st.pack].items.length); st.act.custom = null; } }, ['act']);
});
$('#rollAll').addEventListener('click', () => { const b = $('#rollAll'); b.classList.remove('rolling'); void b.offsetWidth; b.classList.add('rolling'); rollAll(); });
function doUndo() { if (!undo.length) return; redo.push(clone(st)); st = undo.pop(); store.set('state', st); render(); }
function doRedo() { if (!redo.length) return; undo.push(clone(st)); st = redo.pop(); store.set('state', st); render(); }
$('#undo').addEventListener('click', doUndo);
$('#redo').addEventListener('click', doRedo);

// смена скелета: если в шагах есть закреплённое или своё — спросить прямо на странице
function askSkeleton(k) {
  if (k === st.skel) return;
  const kept = st.steps.filter((s) => s.lock || s.custom).length;
  const go = () => { $('#confirm').hidden = true; const flash = ['s0', 's1', 's2', 's3']; commit(() => {
    const S = SKELETONS[k], p14 = ri(S.p14.length), p23 = ri(S.p23.length);
    st.skel = k; st.steps = [p14, p23, p23, p14].map((p) => ({ p, lock: false, custom: null }));
  }, flash); };
  if (!kept) return go();
  const c = $('#confirm');
  c.innerHTML = `<span>Переключить на «${esc(SKELETONS[k].name)}»? Четыре шага сюжета выпадут заново, даже закреплённые (${kept}). Завязка, действие, выбор и секрет останутся.</span><span></span><button class="btn" id="cfYes">Переключить</button><button class="ghost" id="cfNo">Отмена</button>`;
  c.hidden = false;
  $('#cfYes').onclick = go;
  $('#cfNo').onclick = () => { c.hidden = true; };
  $('#cfYes').focus();
}

// текстом
function asText() {
  const S = SKELETONS[st.skel], c = choiceData(), a = actText(), e = eggText();
  const L = [`# Квест: ${S.name.toLowerCase()}`, '', '## Завязка', ideaText(), '', '## Сюжет'];
  for (let k = 0; k < 4; k++) { const t = stepText(k); L.push(`${k + 1}. **${S.labels[k]}: ${t.t}** — ${t.d}`); }
  L.push('', `## Действие (на шаге ${st.act.at})`, `**${a.t}** — ${a.d}`);
  L.push('', `## Выбор${st.choice.custom ? '' : ': ' + c.type} (на шаге ${st.choice.at})`, `**${c.t}**`);
  if (st.choice.custom) L.push(c.d || ''); else L.push(`- ${c.a}: ${c.ra}`, `- ${c.b}: ${c.rb}`, `- Аукнется позже: ${c.later}`);
  L.push('', `## Секрет (на шаге ${st.egg.at})`, `**${e.t}** — ${e.d}`);
  const tmp = document.createElement('div'); tmp.innerHTML = storyHTML();
  L.push('', '## История', ...[...tmp.querySelectorAll('p')].map((x) => x.textContent));
  return L.join('\n');
}
function copyText(text) {
  try { navigator.clipboard.writeText(text).then(() => toast('Скопировано'), () => toast('Браузер не дал скопировать')); }
  catch { toast('Браузер не дал скопировать'); }
}
$('#copy').addEventListener('click', () => copyText(asText()));

// избранное
let favs = store.get('favs', []);
function renderFavs() {
  $('#favEmpty').hidden = favs.length > 0;
  $('#favList').innerHTML = favs.map((f, i) => `<li><p>${esc(f.title)}</p><div class="row"><button class="ghost" data-fopen="${i}">Открыть</button><button class="ghost" data-fcopy="${i}">Скопировать</button><button class="ghost" data-fdel="${i}">Убрать</button></div></li>`).join('');
}
$('#fav').addEventListener('click', () => {
  favs.unshift({ title: `${SKELETONS[st.skel].name}: ${stepText(0).t} → ${stepText(3).t}`, text: asText(), state: clone(st) });
  favs = favs.slice(0, 50); store.set('favs', favs); renderFavs(); toast('В избранном');
});
$('#favList').addEventListener('click', (e) => {
  const o = e.target.closest('[data-fopen]'), c = e.target.closest('[data-fcopy]'), d = e.target.closest('[data-fdel]');
  if (o) { const f = favs[+o.dataset.fopen]; commit(() => { st = clone(f.state); }); scrollTo({ top: 0, behavior: 'smooth' }); }
  if (c) copyText(favs[+c.dataset.fcopy].text);
  if (d) { favs.splice(+d.dataset.fdel, 1); store.set('favs', favs); renderFavs(); }
});



render();
renderFavs();
})();
</script>
</body>
